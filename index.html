<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Neon Ripple • Interactive Tap & Canvas Experience</title>
  <meta name="description" content="Neon Ripple • Next-level interactive click and tap ripple visualizer with dark mode, multi-touch, synthesized audio chime, and particle dynamics.">
  
  <!-- Modern Typography from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient Background Canvas & Grid Overlay -->
  <div class="ambient-glow" id="ambientGlow" aria-hidden="true"></div>
  <div class="grid-overlay" aria-hidden="true"></div>

  <!-- Main Interaction Surface -->
  <main id="stage" class="stage" aria-label="Interactive Ripple Canvas">
    
    <!-- Top HUD Bar -->
    <header class="hud-top">
      <div class="hud-badge coord-badge">
        <span class="hud-label">COORDS</span>
        <span class="coord-values" id="coordDisplay">
          <span class="coord-val"><span class="axis">X</span> <strong id="valX">0</strong></span>
          <span class="coord-divider">•</span>
          <span class="coord-val"><span class="axis">Y</span> <strong id="valY">0</strong></span>
          <span class="coord-percent" id="coordPercent">(0%, 0%)</span>
        </span>
      </div>

      <div class="hud-badge color-badge">
        <span class="hud-label">COLOR</span>
        <div class="color-preview-wrap">
          <span class="color-swatch" id="colorSwatch"></span>
          <span class="color-value" id="colorValue">hsl(220, 95%, 65%)</span>
        </div>
      </div>

      <div class="hud-badge stats-badge">
        <span class="hud-label">RIPPLES</span>
        <span class="stats-count" id="rippleCount">0</span>
      </div>
    </header>

    <!-- Center Subtle Hint (fades out on first touch) -->
    <div class="prompt-hint" id="promptHint">
      <div class="hint-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="12" cy="12" r="6"></circle>
          <circle cx="12" cy="12" r="2"></circle>
        </svg>
      </div>
      <p class="hint-text">Tap or click anywhere</p>
      <span class="hint-subtext">Multi-touch & drag supported</span>
    </div>

    <!-- Active Elements Layer -->
    <div id="rippleLayer" class="ripple-layer"></div>

    <!-- Persistent Stamp Layer -->
    <div id="stampLayer" class="stamp-layer"></div>

    <!-- Desktop Cursor Follower Light -->
    <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

    <!-- Bottom Glassmorphic Control Dock -->
    <nav class="dock-container" aria-label="Interaction Controls">
      <div class="dock">
        <!-- Mode Switcher -->
        <div class="dock-group mode-selector" role="radiogroup" aria-label="Effect Modes">
          <button type="button" class="dock-btn mode-btn active" data-mode="ripple" role="radio" aria-checked="true" title="Neon Ripple Shockwaves">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9"></circle>
              <circle cx="12" cy="12" r="4"></circle>
            </svg>
            <span>Ripple</span>
          </button>
          
          <button type="button" class="dock-btn mode-btn" data-mode="particles" role="radio" aria-checked="false" title="Sparkle Particle Burst">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3z"></path>
            </svg>
            <span>Sparks</span>
          </button>

          <button type="button" class="dock-btn mode-btn" data-mode="stamp" role="radio" aria-checked="false" title="Persistent Canvas Stamps">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
              <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
              <path d="M2 2l7.586 7.586"></path>
              <circle cx="11" cy="11" r="2"></circle>
            </svg>
            <span>Stamp</span>
          </button>
        </div>

        <div class="dock-divider"></div>

        <!-- Action Controls -->
        <div class="dock-group">
          <!-- Audio Toggle -->
          <button type="button" class="dock-btn icon-only" id="audioToggleBtn" title="Toggle Synthesized Audio Chime" aria-label="Toggle Audio">
            <svg id="audioIconOn" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>
            <svg id="audioIconOff" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>

          <!-- Clear Canvas Button -->
          <button type="button" class="dock-btn icon-only" id="clearBtn" title="Clear Screen & Stamps" aria-label="Clear Screen">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18"></path>
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
            </svg>
          </button>

          <!-- Fullscreen Toggle -->
          <button type="button" class="dock-btn icon-only" id="fullscreenBtn" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
            <svg id="fsEnterIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>
            <svg id="fsExitIcon" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>
            </svg>
          </button>
        </div>
      </div>
    </nav>
  </main>

  <!-- JavaScript Logic -->
  <script src="script.js"></script>
</body>
</html>
