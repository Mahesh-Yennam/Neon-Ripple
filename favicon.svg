<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121629"/>
      <stop offset="100%" stop-color="#07080d"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur1" />
      <feGaussianBlur stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Core Glow Filter -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ripple Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#f093fb" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Outer Shockwave Ring -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.45"/>

  <!-- Mid Shockwave Ring with Glow -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="#00f2fe" stroke-width="2.5" filter="url(#neonGlow)" opacity="0.85"/>

  <!-- Inner Shockwave Ring -->
  <circle cx="32" cy="32" r="9" fill="none" stroke="#f093fb" stroke-width="2" opacity="0.9"/>

  <!-- Radiant Core Orb -->
  <circle cx="32" cy="32" r="4.5" fill="#ffffff" filter="url(#coreGlow)"/>
</svg>
